<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="30" fill="url(#bg-grad)"/>

  <!-- Orbital Cyber Rings -->
  <circle cx="250" cy="230" r="170" stroke="url(#cyan-violet)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6,8"/>
  <circle cx="250" cy="230" r="145" stroke="#00D9FF" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="40,15,10,15"/>
  <circle cx="250" cy="230" r="120" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Subtle Neural Grid / Particles -->
  <g opacity="0.35">
    <circle cx="120" cy="140" r="3" fill="#00D9FF"/>
    <line x1="120" y1="140" x2="160" y2="180" stroke="#00D9FF" stroke-width="1"/>
    <circle cx="160" cy="180" r="2" fill="#8B5CF6"/>
    <circle cx="380" cy="130" r="3" fill="#8B5CF6"/>
    <line x1="380" y1="130" x2="340" y2="170" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="340" cy="170" r="2.5" fill="#00D9FF"/>
    <circle cx="100" cy="320" r="3" fill="#00D9FF"/>
    <circle cx="400" cy="330" r="3" fill="#00D9FF"/>
  </g>

  <!-- Hexagonal Tech Crest Behind Avatar -->
  <polygon points="250,85 360,150 360,280 250,345 140,280 140,150" fill="#0D172A" stroke="url(#cyan-violet)" stroke-width="2" filter="url(#neon-glow)" fill-opacity="0.75"/>

  <!-- Stylized Modern Developer Silhouette -->
  <!-- Torso & Shoulders -->
  <path d="M175 330 C175 275, 205 260, 250 260 C295 260, 325 275, 325 330 Z" fill="url(#cyan-violet)" opacity="0.85"/>
  <path d="M185 330 C190 285, 215 272, 250 272 C285 272, 310 285, 315 330 Z" fill="#080B14"/>

  <!-- Collar / Shirt Neckline -->
  <polygon points="250,285 235,260 265,260" fill="#00D9FF" opacity="0.9"/>

  <!-- Neck -->
  <rect x="238" y="225" width="24" height="40" rx="6" fill="#F8FAFC" opacity="0.85"/>

  <!-- Head Outline -->
  <ellipse cx="250" cy="195" rx="42" ry="50" fill="#F8FAFC" opacity="0.92"/>

  <!-- Hair / Modern Cut -->
  <path d="M208 190 C208 150, 230 135, 260 135 C285 135, 295 152, 294 175 C285 168, 275 165, 260 165 C235 165, 218 178, 208 190 Z" fill="#0A0E1A"/>
  
  <!-- Sleek Cyber HUD Glasses / Visor -->
  <rect x="216" y="185" width="68" height="18" rx="7" fill="#080B14" stroke="#00D9FF" stroke-width="2"/>
  <line x1="222" y1="194" x2="278" y2="194" stroke="#00D9FF" stroke-width="2" stroke-dasharray="8,4" filter="url(#neon-glow)"/>

  <!-- Corner Tech Accents -->
  <path d="M30 60 L30 30 L60 30" stroke="#00D9FF" stroke-width="2" opacity="0.6"/>
  <path d="M470 60 L470 30 L440 30" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>
  <path d="M30 440 L30 470 L60 470" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>
  <path d="M470 440 L470 470 L440 470" stroke="#00D9FF" stroke-width="2" opacity="0.6"/>

  <!-- Badge Card at Bottom -->
  <rect x="110" y="405" width="280" height="55" rx="14" fill="#101827" stroke="url(#cyan-violet)" stroke-width="1.5" filter="url(#neon-glow)" fill-opacity="0.9"/>
  <circle cx="140" cy="432" r="7" fill="#10B981"/>
  <text x="160" y="428" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">SHIVA NANI GURRALA</text>
  <text x="160" y="446" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#00D9FF">AI/ML &amp; FRONTEND INTERN</text>
</svg>
