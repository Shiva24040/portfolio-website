<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bg)"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" fill="#131D31" rx="16 16 0 0"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444"/>
  <circle cx="46" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="64" cy="21" r="5" fill="#10B981"/>
  <text x="300" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" text-anchor="middle">ai-resume-trainer.dev • analysis module</text>

  <!-- Left Glass Panel: Score & Metrics -->
  <rect x="30" y="65" width="220" height="260" rx="12" fill="#101827" stroke="rgba(0, 217, 255, 0.25)" stroke-width="1.5"/>
  <text x="50" y="98" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">ATS SCORE</text>
  
  <!-- Circular Progress Gauge -->
  <circle cx="140" cy="180" r="58" stroke="#1E293B" stroke-width="12" fill="none"/>
  <circle cx="140" cy="180" r="58" stroke="#00D9FF" stroke-width="12" stroke-dasharray="364" stroke-dashoffset="65" stroke-linecap="round" fill="none" filter="url(#card-glow)"/>
  <text x="140" y="185" font-family="'Outfit', sans-serif" font-size="34" font-weight="800" fill="#00D9FF" text-anchor="middle">92%</text>
  <text x="140" y="206" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">OPTIMAL MATCH</text>

  <rect x="50" y="270" width="180" height="8" rx="4" fill="#1E293B"/>
  <rect x="50" y="270" width="155" height="8" rx="4" fill="url(#accent)"/>
  <text x="50" y="295" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Action Verbs: 94/100</text>

  <!-- Right Panel: Keyword & Content Diagnostics -->
  <rect x="270" y="65" width="300" height="260" rx="12" fill="#101827" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5"/>
  <text x="295" y="98" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">AI RECOMMENDATIONS</text>

  <!-- Tag Badges -->
  <g transform="translate(295, 120)">
    <rect x="0" y="0" width="85" height="26" rx="6" fill="#00D9FF" fill-opacity="0.15" stroke="#00D9FF" stroke-width="1"/>
    <text x="42" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00D9FF" text-anchor="middle">+ Python ML</text>
    
    <rect x="95" y="0" width="80" height="26" rx="6" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
    <text x="135" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C4B5FD" text-anchor="middle">+ React.js</text>

    <rect x="185" y="0" width="80" height="26" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <text x="225" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6EE7B7" text-anchor="middle">+ Git CI/CD</text>
  </g>

  <!-- Diagnostic Checklist Rows -->
  <rect x="295" y="170" width="250" height="38" rx="8" fill="#1E293B" fill-opacity="0.6"/>
  <circle cx="315" cy="189" r="6" fill="#10B981"/>
  <text x="332" y="193" font-family="'Inter', sans-serif" font-size="11.5" fill="#E2E8F0">Strong impact metric quantification</text>

  <rect x="295" y="218" width="250" height="38" rx="8" fill="#1E293B" fill-opacity="0.6"/>
  <circle cx="315" cy="237" r="6" fill="#00D9FF"/>
  <text x="332" y="241" font-family="'Inter', sans-serif" font-size="11.5" fill="#E2E8F0">AI prompt engineer skill tag aligned</text>

  <rect x="295" y="266" width="250" height="38" rx="8" fill="#1E293B" fill-opacity="0.6"/>
  <circle cx="315" cy="285" r="6" fill="#F59E0B"/>
  <text x="332" y="289" font-family="'Inter', sans-serif" font-size="11.5" fill="#E2E8F0">Expand 1 bullet on system deployment</text>
</svg>
