<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="100%" stop-color="#140D26"/>
    </linearGradient>
    <linearGradient id="violet-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="cv-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#shield-bg)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="600" height="42" fill="#1C1434" rx="16 16 0 0"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444"/>
  <circle cx="46" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="64" cy="21" r="5" fill="#10B981"/>
  <text x="300" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C4B5FD" text-anchor="middle">agrishield-ai • computer vision diagnostics</text>

  <!-- Left: Computer Vision Leaf Inspection Frame -->
  <rect x="30" y="65" width="250" height="260" rx="12" fill="#17112E" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>
  
  <!-- Leaf silhouette graphic -->
  <path d="M155 105 C210 130, 220 220, 155 255 C90 220, 100 130, 155 105 Z" fill="#064E3B" opacity="0.6"/>
  <path d="M155 110 L155 250" stroke="#10B981" stroke-width="2"/>
  <path d="M155 145 L185 130 M155 175 L190 160 M155 205 L180 195" stroke="#10B981" stroke-width="1.5"/>
  <path d="M155 145 L125 130 M155 175 L120 160 M155 205 L130 195" stroke="#10B981" stroke-width="1.5"/>

  <!-- AI Detection Bounding Box -->
  <rect x="115" y="145" width="85" height="70" rx="4" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,4" filter="url(#cv-glow)"/>
  <rect x="115" y="128" width="85" height="18" rx="2" fill="#EF4444"/>
  <text x="157" y="141" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">BLIGHT 96.4%</text>

  <!-- Scanline -->
  <line x1="30" y1="180" x2="280" y2="180" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="10,5"/>

  <!-- Right: Diagnosis & Prescription -->
  <rect x="300" y="65" width="270" height="260" rx="12" fill="#17112E" stroke="rgba(236, 72, 153, 0.25)" stroke-width="1.5"/>
  <text x="320" y="98" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">DIAGNOSTIC REPORT</text>
  
  <rect x="320" y="115" width="230" height="50" rx="8" fill="#241945"/>
  <text x="335" y="135" font-family="'Inter', sans-serif" font-size="11" fill="#C4B5FD">Pathogen Classification</text>
  <text x="335" y="153" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#F43F5E">Early Leaf Blight (Alternaria)</text>

  <rect x="320" y="175" width="230" height="50" rx="8" fill="#241945"/>
  <text x="335" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#C4B5FD">Remedy Recommendation</text>
  <text x="335" y="213" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#34D399">Neem-based Bio-Spray (3ml/L)</text>

  <rect x="320" y="235" width="230" height="70" rx="8" fill="#241945"/>
  <text x="335" y="255" font-family="'Inter', sans-serif" font-size="11" fill="#C4B5FD">Model Performance</text>
  <text x="335" y="275" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A78BFA">Inference Speed: 38ms</text>
  <text x="335" y="293" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Architecture: MobileNetV3-Quantized</text>
</svg>
