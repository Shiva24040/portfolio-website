<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Hexagon -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#080B14" stroke="url(#cyber-grad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Neural Nodes -->
  <circle cx="50" cy="18" r="3" fill="#00D9FF" />
  <circle cx="80" cy="35" r="3" fill="#8B5CF6" />
  <circle cx="80" cy="65" r="3" fill="#00D9FF" />
  <circle cx="50" cy="82" r="3" fill="#8B5CF6" />
  <circle cx="20" cy="65" r="3" fill="#00D9FF" />
  <circle cx="20" cy="35" r="3" fill="#8B5CF6" />

  <!-- Connecting traces -->
  <path d="M50 18 L32 40 L68 40 L50 82" stroke="url(#cyber-grad)" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2,2" />

  <!-- Monogram SN -->
  <text x="50" y="58" font-family="'Outfit', 'Inter', sans-serif" font-size="30" font-weight="900" fill="url(#cyber-grad)" text-anchor="middle" letter-spacing="-1">SN</text>
</svg>
